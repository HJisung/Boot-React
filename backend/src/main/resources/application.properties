spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/malldb}
spring.datasource.username=${DB_USER:malldbuser}
spring.datasource.password=${DB_PASSWORD:malldbuser}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.config.import=optional:file:./src/main/resources/application-local.properties

spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB
org.zerock.upload.path=${UPLOAD_PATH:upload}

kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/member/kakao}
kakao.token-url=${KAKAO_TOKEN_URL:https://kauth.kakao.com/oauth/token}
kakao.user-url=${KAKAO_USER_URL:https://kapi.kakao.com/v2/user/me}
